user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ---- 1. No revelar la versió ----
    server_tokens off;

    # ---- 2. Logs en JSON per a Loki (sense query string: hi podria haver tokens) ----
    log_format json_segur escape=json
      '{"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":"$status",'
      '"bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"user_agent":"$http_user_agent",'
      '"limit_req":"$limit_req_status"}';
    access_log /var/log/nginx/access.json.log json_segur;

    # ---- 3. Límits anti-DoS bàsics ----
    client_max_body_size   2m;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      15s;
    send_timeout           10s;

    # ---- 4. Rate limiting ----
    limit_req_zone  $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---- 5. Bloqueig de bots i escàners per User-Agent ----
    map $http_user_agent $bot_dolent {
        default                         0;
        ~*(sqlmap|nikto|nmap|masscan|zgrab|wpscan|dirbuster|gobuster) 1;
        ""                              1;
    }

    # ---- 6. WebSockets (Grafana Live) ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
