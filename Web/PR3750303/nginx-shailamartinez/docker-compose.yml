services:
  # ---------- Capa web ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-segur
    environment:
      DOMINI: ${DOMINI}
      XX: ${XX}
    ports:                       # ÚNICS ports publicats de tot l'stack
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    networks: [frontal, monitoratge]
    depends_on:                # Nginx no arrenca si no pot resoldre els upstreams
      - web
      - grafana
    restart: unless-stopped

  web:
    image: traefik/whoami:v1.10
    container_name: web-backend
    networks: [frontal]
    restart: unless-stopped

  # ---------- Monitoratge ----------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command: ["--nginx.scrape-uri=http://nginx:8080/stub_status"]
    networks: [monitoratge]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoratge]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks: [monitoratge]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: alloy
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - nginx-logs:/var/log/nginx:ro
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
    networks: [monitoratge]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMINI}/
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoratge]
    restart: unless-stopped

networks:
  frontal:
  monitoratge:
    ipam:
      config:
        - subnet: 10.10.${XX}.0/24

volumes:
  nginx-logs:
  prometheus-data:
  loki-data:
  grafana-data:
