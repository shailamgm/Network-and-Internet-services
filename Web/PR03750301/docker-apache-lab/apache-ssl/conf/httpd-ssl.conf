# Mòduls necessaris
LoadModule alias_module modules/mod_alias.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule headers_module modules/mod_headers.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule rewrite_module modules/mod_rewrite.so

ServerName localhost
# Sense Listen, Apache s'atura: "no listening sockets available"
Listen 80
Listen 443

User daemon
Group daemon

TypesConfig conf/mime.types
DirectoryIndex index.html

# Configuració de logging
LogLevel warn

# Format estàndard
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

# Temps de resposta en microsegons
LogFormat "%h %l %u %t \"%r\" %>s %b %D" with_response_time

# Informació SSL
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{SSL_PROTOCOL}x\" \"%{SSL_CIPHER}x\"" ssl_combined

# Format JSON
LogFormat "{ \"timestamp\": \"%{%Y-%m-%dT%H:%M:%S}t\", \"client\": \"%h\", \"request\": \"%r\", \"status\": %>s, \"bytes\": %b, \"referer\": \"%{Referer}i\", \"user_agent\": \"%{User-Agent}i\", \"response_time_us\": %D }" json_log

# Cache SSL per millorar el rendiment
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300


<Directory "/usr/local/apache2/htdocs">
    AllowOverride All
    Require all granted
</Directory>

# Virtual Host HTTP (port 80) - Redirigeix a HTTPS
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/usr/local/apache2/htdocs"

    # Redirigeix tot el tràfic HTTP a HTTPS.
    # Al laboratori l'HTTPS es publica al port 8443 de l'amfitrió; en producció
    # (port 443) la regla seria: RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{SERVER_NAME}:8443$1 [R=301,L]

    ErrorLog "logs/http-error.log"
    CustomLog "logs/http-access.log" combined
</VirtualHost>

# Virtual Host HTTPS (port 443)
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot "/usr/local/apache2/htdocs"

    # Activa SSL
    SSLEngine on

    # Rutes als certificats
    SSLCertificateFile "/usr/local/apache2/certs/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/certs/server.key"

    # Protocols SSL/TLS moderns (desactiva versions antigues insegures)
    # Seguint les recomanacions de seguretat 2025
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Cipher suites segures (prioritza algoritmes moderns)
    SSLCipherSuite HIGH:!aNULL:!MD5:!RC4
    SSLHonorCipherOrder on

    # Capçaleres de seguretat HTTP
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log d'errors HTTPS
ErrorLog /proc/self/fd/2

# Log estàndard HTTPS
CustomLog /proc/self/fd/1 combined

# Log amb temps de resposta
CustomLog "logs/response-time.log" with_response_time

# Log amb informació SSL
CustomLog "logs/ssl-access.log" ssl_combined

# Log en format JSON
CustomLog "logs/json-access.log" json_log

# Registrar només errors 4xx i 5xx
CustomLog "logs/errors-only.log" combined "expr=%{REQUEST_STATUS} >= 400"

# Logs d'imatges
SetEnvIf Request_URI "\.jpg$" image-request
SetEnvIf Request_URI "\.png$" image-request
SetEnvIf Request_URI "\.gif$" image-request
CustomLog "logs/images.log" combined env=image-request

# Excloure healthchecks del log d'accés
SetEnvIf Request_URI "^/health$" dontlog
CustomLog "logs/access.log" combined env=!dontlog
</VirtualHost>

# Virtual Host HTTP: redirecció a HTTPS
<VirtualHost *:80>
    ServerName secure-site-shailamartinez.local
    Redirect permanent / https://secure-site-shailamartinez.local:8443/
</VirtualHost>

# Virtual Host HTTPS
<VirtualHost *:443>
    ServerName secure-site-shailamartinez.local
    DocumentRoot "/usr/local/apache2/htdocs/secure-site"

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/certs/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/certs/server.key"

    <Directory "/usr/local/apache2/htdocs/secure-site">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/secure-site-error.log"
    CustomLog "logs/secure-site-access.log" combined
</VirtualHost>